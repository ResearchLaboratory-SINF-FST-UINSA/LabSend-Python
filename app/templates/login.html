<!DOCTYPE html>
<html class="light" lang="en" id="html-root">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - LabSend Print Transfer</title>
    <link id="favicon-link" rel="icon" type="image/png" href="{{ config.app_icon_url or '' }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .dark body, body.dark {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
    </style>
    <script>
        (function() {
            var theme = '{{ config.theme | default("light") }}';
            var htmlRoot = document.getElementById('html-root');
            if (theme === 'dark') {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4">
                {% if config.app_icon_url %}
                <img src="{{ config.app_icon_url }}" alt="Logo" class="w-full h-full object-cover rounded-full">
                {% else %}L{% endif %}
            </div>
            <h1 class="text-2xl font-bold text-gray-900">LabSend</h1>
            <p class="text-gray-500 mt-1">Print Transfer System</p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Masukkan username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="Masukkan password">
            </div>

            <div id="error-message" class="hidden text-red-500 text-sm text-center"></div>

            <button type="submit" id="login-btn"
                class="w-full bg-indigo-600 text-white py-3 rounded-lg hover:bg-indigo-700 transition-colors font-semibold flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">login</span>
                Login
            </button>
        </form>

        <div class="mt-4 text-center">
            <p class="text-sm text-gray-500">Belum punya akun? <a href="/register" class="text-indigo-600 hover:text-indigo-700 font-medium">Daftar sekarang</a></p>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center">
            <p class="text-xs text-gray-400">
                © 2026 <a href="https://azizlab.my.id" class="hover:text-indigo-600">azizlab.my.id</a>. All rights reserved.
            </p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white py-3 px-6 rounded-lg font-medium text-sm shadow-lg hidden z-50"></div>

    <script>
        var redirectTo = '{{ redirect_to | default("/admin") }}';

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var errorDiv = document.getElementById('error-message');
            var loginBtn = document.getElementById('login-btn');

            errorDiv.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Memproses...';

            try {
                var formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                var response = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });

                var data = await response.json();

                if (data.success) {
                    // Store token
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    showToast('Login berhasil!');

                    // Determine redirect based on role
                    var targetUrl = redirectTo;
                    if (redirectTo === '/admin' && data.user.role !== 'admin') {
                        // Students go to dashboard
                        targetUrl = '/student/dashboard';
                    }

                    // Redirect after short delay
                    setTimeout(function() {
                        window.location.href = targetUrl;
                    }, 500);
                } else {
                    errorDiv.textContent = data.message || 'Login gagal';
                    errorDiv.classList.remove('hidden');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> Login';
                }
            } catch (e) {
                errorDiv.textContent = 'Error: ' + e.message;
                errorDiv.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span class="material-symbols-outlined">login</span> Login';
            }
        });

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(function() {
                toast.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
