<!DOCTYPE html>
<html class="light" lang="id" id="html-root">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Dashboard Mahasiswa - LabSend Print Transfer</title>
    <link id="favicon-link" rel="icon" type="image/png" href="{{ config.app_icon_url or '' }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .dark body, body.dark {
            background: #0f172a;
        }
        .file-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-uploaded {
            background-color: #d1fae5;
            color: #065f46;
        }
        .status-waiting_upload {
            background-color: #fef3c7;
            color: #92400e;
        }
        .status-previewed {
            background-color: #bfdbfe;
            color: #1e40af;
        }
        .status-printed {
            background-color: #c7d2fe;
            color: #3730a3;
        }
        .status-rejected {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
    <script>
        (function() {
            var theme = '{{ config.theme | default("light") }}';
            var htmlRoot = document.getElementById('html-root');
            if (theme === 'dark') {
                htmlRoot.classList.remove('light');
                htmlRoot.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="bg-white dark:bg-slate-900 text-gray-900 dark:text-gray-100">

    <!-- Navigation -->
    <nav class="bg-white dark:bg-slate-800 shadow">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">
                        {% if config.app_icon_url %}
                        <img src="{{ config.app_icon_url }}" alt="Logo" class="w-full h-full object-cover rounded-full">
                        {% else %}L{% endif %}
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">LabSend</h1>
                        <p class="text-xs text-gray-500 dark:text-gray-400">Dashboard Mahasiswa</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="showProfile()" class="px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg transition">
                        <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 20px;">account_circle</span>
                    </button>
                    <button onclick="logout()" class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                        <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 20px;">logout</span> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Welcome Section -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2">Selamat datang, <span id="student-name">Mahasiswa</span>!</h2>
            <p class="text-gray-600 dark:text-gray-400" id="student-nim">NIM: -</p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-blue-50 dark:bg-slate-800 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-400 text-sm">Total Upload</p>
                        <p class="text-3xl font-bold text-blue-600" id="stat-total-uploads">0</p>
                    </div>
                    <span class="material-symbols-outlined text-4xl text-blue-600" style="opacity: 0.2">cloud_upload</span>
                </div>
            </div>
            <div class="bg-green-50 dark:bg-slate-800 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-400 text-sm">File Selesai</p>
                        <p class="text-3xl font-bold text-green-600" id="stat-completed-files">0</p>
                    </div>
                    <span class="material-symbols-outlined text-4xl text-green-600" style="opacity: 0.2">check_circle</span>
                </div>
            </div>
            <div class="bg-purple-50 dark:bg-slate-800 rounded-lg p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 dark:text-gray-400 text-sm">Total File</p>
                        <p class="text-3xl font-bold text-purple-600" id="stat-total-files">0</p>
                    </div>
                    <span class="material-symbols-outlined text-4xl text-purple-600" style="opacity: 0.2">description</span>
                </div>
            </div>
        </div>

        <!-- Uploads Section -->
        <div class="bg-white dark:bg-slate-800 rounded-lg shadow">
            <div class="border-b dark:border-slate-700 px-6 py-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold flex items-center gap-2">
                        <span class="material-symbols-outlined">folder_open</span>
                        File yang Telah Di-Upload
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="location.reload()" class="px-4 py-2 text-sm bg-gray-200 dark:bg-slate-700 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-slate-600 transition">
                            <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 18px;">refresh</span> Refresh
                        </button>
                    </div>
                </div>
            </div>

            <div class="p-6" id="uploads-container">
                <div class="text-center py-8">
                    <div class="inline-block p-4 bg-gray-100 dark:bg-slate-700 rounded-full mb-4">
                        <span class="material-symbols-outlined text-4xl text-gray-400">folder_open</span>
                    </div>
                    <p class="text-gray-600 dark:text-gray-400">Memuat data...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 rounded-lg shadow-lg p-6 w-full max-w-md">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold">Profil Saya</h3>
                <button onclick="closeProfile()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                    <input type="text" id="profile-username" readonly class="w-full px-3 py-2 bg-gray-100 dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-lg border border-gray-300 dark:border-slate-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nama Lengkap</label>
                    <input type="text" id="profile-name" readonly class="w-full px-3 py-2 bg-gray-100 dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-lg border border-gray-300 dark:border-slate-600">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">NIM</label>
                    <input type="text" id="profile-nim" readonly class="w-full px-3 py-2 bg-gray-100 dark:bg-slate-700 text-gray-900 dark:text-gray-100 rounded-lg border border-gray-300 dark:border-slate-600">
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button onclick="closeProfile()" class="flex-1 px-4 py-2 bg-gray-300 dark:bg-slate-700 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-400 dark:hover:bg-slate-600 transition">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <script>
        // Get extension icon
        function getFileIcon(extension) {
            const ext = extension.toLowerCase();
            const iconMap = {
                'pdf': '📄',
                'doc': '📄', 'docx': '📄', 'txt': '📄',
                'xls': '📊', 'xlsx': '📊', 'csv': '📊',
                'ppt': '🎯', 'pptx': '🎯',
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'mp3': '🎵', 'mp4': '🎬', 'avi': '🎬',
            };
            return iconMap[ext] || '📄';
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // Format date
        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleDateString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Get status badge
        function getStatusBadge(status) {
            const statusMap = {
                'uploaded': { label: 'Selesai Upload', badge: 'status-uploaded' },
                'waiting_upload': { label: 'Menunggu Upload', badge: 'status-waiting_upload' },
                'previewed': { label: 'Dilihat', badge: 'status-previewed' },
                'printed': { label: 'Dicetak', badge: 'status-printed' },
                'rejected': { label: 'Ditolak', badge: 'status-rejected' },
                'deleted': { label: 'Dihapus', badge: 'status-rejected' }
            };
            const info = statusMap[status] || { label: status, badge: 'status-waiting_upload' };
            return `<span class="status-badge ${info.badge}">${info.label}</span>`;
        }

        // Load profile
        async function loadProfile() {
            try {
                const response = await fetch('/api/student/profile');
                const data = await response.json();

                if (data.success) {
                    const profile = data.profile;
                    document.getElementById('student-name').textContent = profile.student_name || profile.username;
                    document.getElementById('student-nim').textContent = 'NIM: ' + (profile.student_nim || '-');
                    document.getElementById('profile-username').value = profile.username;
                    document.getElementById('profile-name').value = profile.student_name || '-';
                    document.getElementById('profile-nim').value = profile.student_nim || '-';
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        // Load uploads
        async function loadUploads() {
            try {
                const response = await fetch('/api/student/my-uploads');
                const data = await response.json();

                if (data.success) {
                    renderUploads(data.uploads);
                } else {
                    showError('Gagal memuat data upload');
                }
            } catch (error) {
                console.error('Error loading uploads:', error);
                showError('Terjadi kesalahan saat memuat data');
            }
        }

        // Render uploads
        function renderUploads(uploads) {
            const container = document.getElementById('uploads-container');

            if (!uploads || uploads.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <div class="inline-block p-4 bg-gray-100 dark:bg-slate-700 rounded-full mb-4">
                            <span class="material-symbols-outlined text-4xl text-gray-400">folder_open</span>
                        </div>
                        <p class="text-gray-600 dark:text-gray-400 mb-2">Belum ada file yang di-upload</p>
                        <p class="text-sm text-gray-500 dark:text-gray-500">Mulai upload file menggunakan QR code</p>
                    </div>
                `;
                updateStats(uploads);
                return;
            }

            // Calculate stats
            updateStats(uploads);

            // Build uploads HTML
            let html = '<div class="space-y-4">';

            uploads.forEach(upload => {
                const createdDate = formatDate(upload.created_at);
                const uploadedDate = upload.uploaded_at ? formatDate(upload.uploaded_at) : '-';

                html += `
                    <div class="border dark:border-slate-700 rounded-lg p-4 hover:shadow-md dark:hover:shadow-lg transition">
                        <div class="flex items-start justify-between mb-3">
                            <div class="flex-1">
                                <h4 class="font-semibold text-gray-900 dark:text-gray-100 mb-1">
                                    ${upload.student_name} (${upload.student_nim})
                                </h4>
                                <p class="text-sm text-gray-600 dark:text-gray-400">
                                    Dibuat: ${createdDate}
                                </p>
                            </div>
                            <div>${getStatusBadge(upload.status)}</div>
                        </div>

                        <div class="bg-gray-50 dark:bg-slate-700 rounded-lg p-3 mb-3">
                            <p class="text-xs text-gray-600 dark:text-gray-400 mb-2">
                                ${upload.total_files} file • ${formatFileSize(upload.total_size)}
                            </p>
                            
                            ${upload.files.length > 0 ? `
                                <div class="space-y-2">
                                    ${upload.files.slice(0, 3).map(file => `
                                        <div class="flex items-center gap-2 text-sm">
                                            <div class="file-icon" style="background-color: rgba(99, 102, 241, 0.1); color: rgb(99, 102, 241);">
                                                ${getFileIcon(file.extension)}
                                            </div>
                                            <div class="flex-1 min-w-0">
                                                <p class="truncate text-gray-800 dark:text-gray-200" title="${file.original_name}">
                                                    ${file.original_name}
                                                </p>
                                                <p class="text-xs text-gray-500 dark:text-gray-400">
                                                    ${formatFileSize(file.size_bytes)}
                                                </p>
                                            </div>
                                        </div>
                                    `).join('')}
                                    ${upload.files.length > 3 ? `
                                        <p class="text-xs text-gray-600 dark:text-gray-400 pl-12">
                                            ... dan ${upload.files.length - 3} file lainnya
                                        </p>
                                    ` : ''}
                                </div>
                            ` : `
                                <p class="text-gray-500 dark:text-gray-400 text-xs">Belum ada file</p>
                            `}
                        </div>

                        <div class="flex gap-2 text-xs text-gray-600 dark:text-gray-400">
                            <span>
                                <span class="material-symbols-outlined" style="vertical-align: middle; font-size: 14px;">upload_file</span>
                                Diupload: ${uploadedDate}
                            </span>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // Update statistics
        function updateStats(uploads) {
            let totalUploads = uploads.length;
            let totalFiles = 0;
            let completedFiles = 0;

            uploads.forEach(upload => {
                totalFiles += upload.total_files;
                if (upload.status === 'printed' || upload.status === 'previewed') {
                    completedFiles += upload.total_files;
                }
            });

            document.getElementById('stat-total-uploads').textContent = totalUploads;
            document.getElementById('stat-total-files').textContent = totalFiles;
            document.getElementById('stat-completed-files').textContent = completedFiles;
        }

        // Profile modal
        function showProfile() {
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfile() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        // Logout
        async function logout() {
            if (confirm('Apakah Anda yakin ingin logout?')) {
                try {
                    await fetch('/api/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        }
                    });
                    window.location.href = '/login';
                } catch (error) {
                    console.error('Logout error:', error);
                }
            }
        }

        // Show error
        function showError(message) {
            const container = document.getElementById('uploads-container');
            container.innerHTML = `
                <div class="bg-red-50 dark:bg-red-900 border border-red-200 dark:border-red-700 rounded-lg p-4">
                    <p class="text-red-800 dark:text-red-200">${message}</p>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProfile();
            loadUploads();

            // Auto-refresh every 30 seconds
            setInterval(loadUploads, 30000);
        });

        // Close modal when clicking outside
        document.getElementById('profile-modal')?.addEventListener('click', (e) => {
            if (e.target.id === 'profile-modal') {
                closeProfile();
            }
        });
    </script>
</body>
</html>
